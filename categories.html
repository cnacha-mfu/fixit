<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>จัดการหมวดหมู่ — FixIt</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">🔧 FixIt</a>
    <nav>
      <a href="tickets.html">รายการแจ้งซ่อม</a>
      <a href="new-ticket.html">แจ้งซ่อมใหม่</a>
      <a href="categories.html">หมวดหมู่</a>
      <a href="dashboard.html">แดชบอร์ด</a>
    </nav>
    <div class="user-box" id="user-box"></div>
  </header>

  <main>
    <h1>🗂️ จัดการหมวดหมู่ปัญหา</h1>
    <div id="notice-area"></div>

    <form id="add-form" class="card" style="display:flex;gap:0.5rem;align-items:flex-end;flex-wrap:wrap">
      <div class="field" style="flex:1;min-width:200px;margin-bottom:0">
        <label for="new-name">ชื่อหมวดหมู่ใหม่</label>
        <input id="new-name" type="text" placeholder="เช่น เฟอร์นิเจอร์">
      </div>
      <button type="submit" class="btn btn-primary">เพิ่ม</button>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ชื่อหมวดหมู่</th><th style="width:12rem"></th></tr>
        </thead>
        <tbody id="category-rows"></tbody>
      </table>
    </div>
    <p id="empty-message" class="hidden" style="margin-top:1rem">ยังไม่มีหมวดหมู่ในระบบ</p>
  </main>

  <script type="module" src="js/categories.js"></script>
</body>
</html>
